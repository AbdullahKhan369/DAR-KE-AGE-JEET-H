<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Smart Sticky Pro</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body data-panel-theme="light">
    <div class="app-shell">
      <header class="topbar card">
        <div>
          <h1>Smart Sticky Pro</h1>
          <p class="subtitle">Smooth sticky-notes workspace</p>
        </div>
        <div class="top-controls">
          <label class="control-row">
            <span>Main Theme</span>
            <select id="panel-theme-select">
              <option value="light">Light</option>
              <option value="dark">Dark</option>
            </select>
          </label>
          <label class="control-row">
            <input id="startup-toggle" type="checkbox" />
            <span>Pin to Start (Open with Windows)</span>
          </label>
          <button id="google-auth-btn" class="btn btn-primary">Google Login</button>
          <span id="google-status" class="chip">Local storage only</span>
        </div>
      </header>

      <main class="workspace">
        <aside class="sidebar card" id="notes-history">
          <div class="side-head">
            <h2>All Notes History</h2>
            <button id="new-note-btn" class="btn btn-primary">+ New Note</button>
          </div>
          <ul id="notes-list" class="notes-list"></ul>
        </aside>

        <section id="notes-board" class="board card" aria-label="Notes board"></section>
      </main>
    </div>

    <div id="lead-modal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="lead-modal-title">
      <div class="modal-content card">
        <h3 id="lead-modal-title">Add Lead</h3>
        <form id="lead-form">
          <label>Name<input id="lead-name" type="text" required maxlength="80" /></label>
          <label>
            Eligibility
            <select id="lead-eligibility">
              <option value="Part B">Part B</option>
              <option value="ELSE">ELSE</option>
              <option value="Atena">Atena</option>
            </select>
          </label>
          <div class="modal-actions">
            <button type="button" id="close-lead-modal" class="btn btn-secondary">Cancel</button>
            <button type="submit" class="btn btn-primary">Save</button>
          </div>
        </form>
      </div>
    </div>

    <script src="renderer.js"></script>
  </body>
</html>
